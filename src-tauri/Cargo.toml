[package]
name = "nu_pos_hub_tray"
version = "0.2.0"
description = "Sirvo POS Hub tray app"
authors = ["Industria"]
license = ""
edition = "2021"
rust-version = "1.77"

[lib]
name = "nu_pos_hub_tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
once_cell = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
log = "0.4"
env_logger = "0.11"
sys-locale = "0.3"

# Odoo password storage (see docs/spec_odoo_credentials.md). Each OS needs its
# backend enabled explicitly — without one, keyring silently uses a mock store.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
